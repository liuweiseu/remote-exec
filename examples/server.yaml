# remote-exec-server configuration (used with `remote-exec-server --config FILE`).
# Every key is the long form of a CLI option; CLI options override this file.

host: 0.0.0.0          # or e.g. the Tailscale/WireGuard address only
port: 50051
# listen: 0.0.0.0:50051  # alternative to host + port

# Authentication is mandatory on non-loopback addresses.
token_file: /etc/remote-exec/token     # owned by the service user, mode 600

# Optional TLS; adding tls_client_ca enables mutual TLS.
# tls_cert: /etc/remote-exec/server.pem
# tls_key: /etc/remote-exec/server.key
# tls_client_ca: /etc/remote-exec/ca.pem

shell: /bin/bash
max_concurrent: 32
# max_timeout: 86400   # cap every command at 24h
kill_grace: 5

log_level: INFO
# log_file: /var/log/remote-exec/server.log   # journald already captures stderr

# Command log: every command and its output. Relative paths are relative to
# the directory the server is started from (systemd: WorkingDirectory=).
command_log: remote-exec-commands.log
command_log_max_mb: 10     # start a new file beyond this size
command_log_keep: 0        # rotated files to keep; 0 = all
# no_command_log: true

# Allowed/denied programs (default: ~/.config/remote-exec/tools.yaml if present,
# otherwise everything except ssh). See examples/tools.yaml.
# tools: /etc/remote-exec/tools.yaml
