[project]
name = "remote-exec"
version = "0.1.0"
description = "Lightweight gRPC remote command execution with real-time stdout/stderr streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8",
    "pyyaml>=6.0",
]

[project.scripts]
remote-exec-server = "remote_exec.server_cli:main"
remote-exec-client = "remote_exec.client_cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_exec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
